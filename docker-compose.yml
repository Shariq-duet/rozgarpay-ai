version: '3.8'

services:
  rozgarpay-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rozgarpay-ai-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - AMD_VLLM_BASE_URL=${AMD_VLLM_BASE_URL:-https://api.amd-cloud.example.com/v1}
      - AMD_API_KEY=${AMD_API_KEY:-mock_amd_key}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-Qwen/Qwen2.5-72B-Instruct}
      - AMD_ACCELERATOR_TARGET=${AMD_ACCELERATOR_TARGET:-AMD Instinct MI300X}
      - MOCK_AMD_BACKEND=${MOCK_AMD_BACKEND:-true}
      - RECONCILIATION_TOLERANCE_PERCENT=${RECONCILIATION_TOLERANCE_PERCENT:-1.0}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
